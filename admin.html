<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Administração</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <a href="index.html" class="back-link">&larr; Voltar para o Site</a>
            <h1>Nova Postagem</h1>
        </header>

        <form id="post-form" class="post-form">

            <div class="form-group">
                <label>Foto ou Vídeo</label>
                <div id="upload-area" class="file-upload" style="cursor:pointer; display:flex; align-items:center; justify-content:center; min-height:200px;">
                    <div id="upload-placeholder" class="upload-placeholder">
                        <span>📁 Clique para escolher foto ou vídeo</span>
                        <small>Sem limite de tamanho</small>
                    </div>
                    <div id="upload-preview" style="display:none; width:100%; text-align:center;"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="caption">Legenda (opcional)</label>
                <textarea id="caption" rows="4" placeholder="Escreva algo..."></textarea>
            </div>

            <div class="form-group">
                <label for="likes">Curtidas Iniciais</label>
                <input type="number" id="likes" min="0" value="0">
            </div>

            <button type="submit" class="submit-btn" id="submit-btn" disabled>Publicar no Site</button>
        </form>

        <div id="success-message" class="hidden">
            ✅ Postagem publicada com sucesso! Atualize o site para ver.
        </div>
    </div>

    <!-- Cloudinary Upload Widget (solucao oficial sem problemas de CORS) -->
    <script src="https://upload-widget.cloudinary.com/global/all.js"></script>
    <script src="firebase-config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
